[tox]
requires =
    tox>=4.2
    tox-gh-actions
    tox-uv>=1.20.2
env_list =
    lint
    d52-py310
    d42-py38
    pkg_meta
skip_missing_interpreters = true

[testenv]
deps =
    d42: django==4.2.*
    d52: django==5.2.*
set_env =
    PYTHONDONTWRITEBYTECODE = true
commands =
    {posargs:pytest tests -rw --create-db}
dependency_groups = dev

[testenv:lint]
description = run static analysis and style check using ruff
skip_install = true
deps =
    pre-commit-uv>=4.1.1
pass_env =
    HOMEPATH
    PROGRAMDATA
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:pkg_meta]
description = check that the long description is valid
skip_install = true
deps =
    check-manifest
    check-wheel-contents>=0.6
    twine>=5.1.1
    uv>=0.5
commands =
    uv build --sdist --wheel --out-dir {env_tmp_dir} .
    twine check {env_tmp_dir}{/}*
    check-wheel-contents --no-config {env_tmp_dir}

[testenv:mypy]
description = run mypy type checking
skip_install = false
set_env =
    SECRET_KEY = super-secret-key-just-for-testing
commands =
    mypy --config-file mypy.ini {posargs:}
dependency_groups = typing
no_default_groups = false
uv_sync_flags = --no-editable
