[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "bitcaster-sdk"
description = "Bitcaster Python SDK"
readme = "README.md"
license = { text = "MIT" }
maintainers = [
  { name = "sax", email = "s.apostolico@gmail.com" },
  { name = "mark", email = "hanarero@gmail.com" },
]
authors = [
  { name = "sax", email = "s.apostolico@gmail.com" },
  { name = "mark", email = "hanarero@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "click",
  "humanfriendly",
  "requests",
]
scripts.bitcaster = "bitcaster_sdk:__cli__.cli"

[dependency-groups]
dev = [
  "pre-commit",
  "pytest",
  "pytest-coverage",
  "pytest-django",
  "pytest-xdist",
  "responses",
  "ruff",
  "tox",
]
docs = [
  "mkdocs>=1.5.3",
  "mkdocs-awesome-pages-plugin>=2.9.3",
  "mkdocs-include-markdown-plugin>=6.2.2",
  "mkdocs-macros-plugin>=1.0.5",
  "mkdocs-material>=9.5.15",
  "mkdocs-redirects>=1.2.1",
  "mkdocstrings[python]>=0.24.1",
  "pymdown-extensions>=10.7.1",
]
typing = [
  "mypy>=1.9",
  "types-requests>=2.32.0.20240712",
]

[tool.hatch]
build.hooks.vcs.version-file = "src/bitcaster_sdk/version.py"
build.targets.sdist.ignore-vcs = true
build.targets.sdist.include = [
  "src/bitcaster_sdk/**/*.*",
]
build.targets.sdist.exclude = [
  "src/bitcaster_sdk/**/~*.*",
]
build.targets.wheel.packages = [ "src/bitcaster_sdk" ]
version.source = "vcs"
raw-options = { root = "../.." }

[tool.check-manifest]
ignore = """
Makefile
*.sqlite
.tox/*"""
